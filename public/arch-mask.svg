<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <!-- Opening of the arch in the intro video's final frame (same 720x1280 frame).
       Used as a CSS mask so scrolling text only shows inside the arch. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0.9" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <polygon points="360,40 450,70 520,112 545,160 570,208 585,256 570,330 612,368 624,450 626,1000 720,1110 720,1280 0,1280 0,1110 94,1000 96,450 108,368 150,330 135,256 150,208 175,160 200,112 270,70 360,40" fill="url(#fade)" filter="url(#soft)"/>
</svg>
